<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FISH FRENZY</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #071522;
            font-family: Arial, sans-serif;
        }

        #game {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #071522, #103c55);
            color: white;
            transition: opacity 0.5s;
        }

        #loading h1 {
            font-size: clamp(35px, 7vw, 75px);
            font-weight: 900;
            letter-spacing: 5px;
            color: #5ee7ff;
            text-shadow: 0 0 25px #00aaff;
        }

        #loading p {
            margin-top: 15px;
            color: #b7eaff;
            font-size: 14px;
        }

        .loader {
            margin-top: 35px;
            width: 220px;
            height: 7px;
            background: #19394b;
            border-radius: 20px;
            overflow: hidden;
        }

        #progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00bfff, #7affdc);
            transition: width 0.2s;
        }

        #status {
            margin-top: 12px;
            font-size: 12px;
            color: #8bd9f5;
        }

        #error {
            display: none;
            margin-top: 20px;
            max-width: 80%;
            color: #ff7777;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div id="game"></div>

    <div id="loading">
        <h1>FISH FRENZY</h1>
        <p>WILLKOMMEN AUF DER INSEL</p>

        <div class="loader">
            <div id="progress"></div>
        </div>

        <div id="status">Lade Spiel...</div>
        <div id="error"></div>
    </div>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!-- Spiel-Verteiler -->
    <script src="verteiler.js"></script>

</body>
</html>
